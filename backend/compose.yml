services:
  botica-postgres:
    image: postgres:16
    container_name: botica-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-botica_inteligente_db}
      POSTGRES_USER: ${POSTGRES_USER:-botica_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botica_password}
    ports:
      - "5432:5432"
    volumes:
      - botica_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-botica_user} -d ${POSTGRES_DB:-botica_inteligente_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - botica-network

  botica-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: botica-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://botica-postgres:5432/${POSTGRES_DB:-botica_inteligente_db}
      DB_USERNAME: ${POSTGRES_USER:-botica_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-botica_password}
      JWT_SECRET: ${JWT_SECRET:-Ym90aWNhLWludGVsaWdlbnRlLWp3dC1zZWNyZXQtcGFyYS1kZXNhcnJvbGxvLWRlbW8tMjAyNg==}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      botica-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - botica-network

  botica-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: botica-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      botica-backend:
        condition: service_healthy
    networks:
      - botica-network

volumes:
  botica_postgres_data:

networks:
  botica-network:
    driver: bridge